name: Render Graphviz diagrams

on:
  push:
    paths:
      - 'dot/**/*.dot'
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Render every dot/*.dot to diagrams/*.svg
        run: |
          mkdir -p diagrams
          for f in dot/*.dot; do
            name=$(basename "$f" .dot)
            dot -Tsvg "$f" -o "diagrams/$name.svg"
            echo "Rendered diagrams/$name.svg"
          done

      - name: Commit rendered SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: render Graphviz diagrams"
          file_pattern: "diagrams/*.svg"
